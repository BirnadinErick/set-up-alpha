services:
  dozzle:
    image: amir20/dozzle:latest
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - dozzle_data:/data
    ports:
      - 8083:8080
    environment:
      - TZ=Europe/Berlin
      - DOZZLE_ENABLE_ACTIONS=true
      - DOZZLE_HOSTNAME=alpha
volumes:
  dozzle_data: